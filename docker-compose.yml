x-panel-environment: &panel-environment
  APP_KEY: '${APP_KEY:?Set APP_KEY in .env}'
  APP_ENV: production
  APP_URL: '${APP_URL:?Set APP_URL in .env}'
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  APP_DEBUG: 'false'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_DATABASE: '${DB_DATABASE:-liberu}'
  DB_USERNAME: '${DB_USERNAME:-liberu}'
  DB_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
  REDIS_HOST: redis
  REDIS_PORT: '6379'

services:
  app:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'
    image: control-panel-laravel:latest
    ports:
      - '${APP_PORT:-8000}:8000'
    environment:
      <<: *panel-environment
      CONTAINER_MODE: http
      OCTANE_SERVER: roadrunner
      WITH_SCHEDULER: 'true'
      WITH_HORIZON: 'false'
      RUNNING_MIGRATIONS_AND_SEEDERS: '${RUNNING_MIGRATIONS_AND_SEEDERS:-false}'
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  reverb:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: control-panel-laravel:latest
    environment:
      <<: *panel-environment
      CONTAINER_MODE: reverb
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    profiles:
      - reverb

  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: control-panel-laravel:latest
    environment:
      <<: *panel-environment
      CONTAINER_MODE: horizon
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    stop_grace_period: 5m

  mysql:
    restart: unless-stopped
    image: mysql:8.0
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set a separate DB_ROOT_PASSWORD in .env}'
      MYSQL_DATABASE: '${DB_DATABASE:-liberu}'
      MYSQL_USER: '${DB_USERNAME:-liberu}'
      MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis:/data
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    profiles: [development]
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${FORWARD_MAIL_PORT:-1025}:1025'
      - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  storage:
    driver: local
  logs:
    driver: local
