openapi: 3.1.0
info:
  title: Control Panel Control Core API
  version: 1.0.0
paths:
  /api/v1/control-panel/control-core/nodes:
    get:
      operationId: control.panel.control.core.nodes.list
      security:
        - sanctum: []
      responses:
        '200':
          description: Authorized node collection.
    post:
      operationId: control.panel.control.core.nodes.create
      security:
        - sanctum: []
      responses:
        '201':
          description: Node registered.
  /api/v1/control-panel/control-core/tasks:
    get: {summary: List operation tasks, responses: {'200': {description: Authorized task collection.}}}
    post: {summary: Queue an idempotent operation, responses: {'201': {description: Task queued.}}}
  /api/v1/control-panel/control-core/inventory:
    get: {summary: List observed inventory, responses: {'200': {description: Authorized inventory collection.}}}
    post: {summary: Record observed inventory, responses: {'201': {description: Inventory recorded.}}}
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
