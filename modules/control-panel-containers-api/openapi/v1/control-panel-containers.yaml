openapi: 3.1.0
info: {title: Control Panel Containers API, version: 1.0.0}
paths:
  /api/v1/control-panel/containers:
    get: {operationId: control.panel.containers.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: control.panel.containers.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [node_id, name, image]}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/containers/resources:
    post: {operationId: control.panel.containers.resources.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/containers/assets:
    post: {operationId: control.panel.containers.assets.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/containers/{workload}:
    get: {operationId: control.panel.containers.show, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/containers/{workload}/start:
    post: {operationId: control.panel.containers.start, security: [{sanctum: []}], responses: {'200': {description: Workload started}}}
  /api/v1/control-panel/containers/{workload}/stop:
    post: {operationId: control.panel.containers.stop, security: [{sanctum: []}], responses: {'200': {description: Workload stopped}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  responses:
    Resource: {description: Created resource, content: {application/json: {schema: {type: object}}}}
    Collection: {description: Authorized team-scoped resources, content: {application/json: {schema: {type: object}}}}
