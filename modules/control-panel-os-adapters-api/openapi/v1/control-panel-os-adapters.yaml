openapi: 3.1.0
info: {title: Control Panel OS Adapters API, version: 1.0.0}
paths:
  /api/v1/control-panel/os-adapters:
    get: {operationId: control.panel.os.adapters.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: control.panel.os.adapters.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Create'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/packages:
    post: {operationId: control.panel.os.adapters.packages.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/services:
    post: {operationId: control.panel.os.adapters.services.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/services/status:
    get: {operationId: control.panel.os.adapters.services.status, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
  /api/v1/control-panel/os-adapters/services/missing:
    get: {operationId: control.panel.os.adapters.services.missing, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
  /api/v1/control-panel/os-adapters/services/stopped:
    get: {operationId: control.panel.os.adapters.services.stopped, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
  /api/v1/control-panel/os-adapters/services/install-commands:
    get: {operationId: control.panel.os.adapters.services.install.commands, security: [{sanctum: []}], responses: {'200': {description: Tenant-scoped, read-only installation suggestions for missing services.}}}
  /api/v1/control-panel/os-adapters/services/{service}/check:
    get: {operationId: control.panel.os.adapters.services.check, security: [{sanctum: []}], parameters: [{name: service, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Resource'}}, '404': {description: Service is outside the current team.}}
  /api/v1/control-panel/os-adapters/services/{service}:
    patch: {operationId: control.panel.os.adapters.services.update, security: [{sanctum: []}], parameters: [{name: service, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Resource'}}, '404': {description: Service is outside the current team.}}
  /api/v1/control-panel/os-adapters/firewall-rules:
    post: {operationId: control.panel.os.adapters.firewall.rules.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/firewall-rules/{rule}:
    patch: {operationId: control.panel.os.adapters.firewall.rules.update, security: [{sanctum: []}], parameters: [{name: rule, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: control.panel.os.adapters.firewall.rules.delete, security: [{sanctum: []}], parameters: [{name: rule, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'204': {description: Firewall rule deleted.}}}
  /api/v1/control-panel/os-adapters/users:
    post: {operationId: control.panel.os.adapters.users.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/filesystems:
    post: {operationId: control.panel.os.adapters.filesystems.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/repositories:
    post: {operationId: control.panel.os.adapters.repositories.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/support-matrix:
    post: {operationId: control.panel.os.adapters.support.matrix.create, security: [{sanctum: []}], responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/os-adapters/{adapter}:
    get: {operationId: control.panel.os.adapters.show, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    Create: {type: object, required: [node_id, operating_system, version], properties: {node_id: {type: string, format: uuid}, operating_system: {type: string}, version: {type: string}, capabilities: {type: object}, metadata: {type: object}}}
  responses:
    Resource: {description: Created resource, content: {application/json: {schema: {type: object}}}}
    Collection: {description: Authorized team-scoped resources, content: {application/json: {schema: {type: object}}}}
