    post: {operationId: control.panel.os.adapters.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Create'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    Create: {type: object, required: [node_id, operating_system, version], properties: {node_id: {type: string, format: uuid}, operating_system: {type: string}, version: {type: string}, capabilities: {type: object}, metadata: {type: object}}}
  responses:
    Resource: {description: Created resource, content: {application/json: {schema: {type: object}}}}
    Collection: {description: Authorized team-scoped resources, content: {application/json: {schema: {type: object}}}}
