openapi: 3.1.0
info:
  title: Control Panel Databases API
  version: 1.0.0
paths:
  /api/v1/control-panel/databases:
    get:
      operationId: control.panel.databases.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized paginated resources}}
    post:
      operationId: control.panel.databases.create
      security: [{sanctum: []}]
      responses: {'201': {description: Database created}}
  /api/v1/control-panel/databases/{database}/users:
    post:
      operationId: control.panel.databases.users.create
      security: [{sanctum: []}]
      responses: {'201': {description: Database user created}}
  /api/v1/control-panel/databases/users/{user}/privileges:
    post:
      operationId: control.panel.databases.privileges.grant
      security: [{sanctum: []}]
      responses: {'201': {description: Database privilege granted}}
  /api/v1/control-panel/databases/{database}/backups:
    post: {operationId: control.panel.databases.backups.create, security: [{sanctum: []}], responses: {'201': {description: Database backup created}}}
  /api/v1/control-panel/databases/{database}/health-checks:
    post: {operationId: control.panel.databases.health.check, security: [{sanctum: []}], responses: {'201': {description: Database health check recorded}}}
  /api/v1/control-panel/databases/{database}/upgrades:
    post: {operationId: control.panel.databases.upgrades.request, security: [{sanctum: []}], responses: {'202': {description: Database upgrade requested}}}
  /api/v1/control-panel/databases/{database}/remote-access:
    post: {operationId: control.panel.databases.remote.access.configure, security: [{sanctum: []}], responses: {'201': {description: Remote database access configured}}}
  /api/v1/control-panel/databases/{database}:
    get: {operationId: control.panel.databases.show, security: [{sanctum: []}], responses: {'200': {description: Authorized database resource}}}
  /api/v1/control-panel/databases/{database}/suspend:
    post: {operationId: control.panel.databases.suspend, security: [{sanctum: []}], responses: {'200': {description: Database suspended.}, '422': {description: Database cannot be suspended.}}}
  /api/v1/control-panel/databases/{database}/archive:
    post: {operationId: control.panel.databases.archive, security: [{sanctum: []}], responses: {'200': {description: Database archived.}, '422': {description: Database is already archived.}}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
