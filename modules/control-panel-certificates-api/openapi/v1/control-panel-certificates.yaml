openapi: 3.1.0
info:
  title: Control Panel Certificates API
  version: 1.0.0
paths:
  /api/v1/control-panel/certificates:
    get:
      operationId: control.panel.certificates.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized paginated certificates}}
    post:
      operationId: control.panel.certificates.create
      security: [{sanctum: []}]
      responses: {'201': {description: Certificate issued}}
  /api/v1/control-panel/certificates/acme-accounts:
    post: {operationId: control.panel.certificates.acme.accounts.create, security: [{sanctum: []}], responses: {'201': {description: ACME account registered}}}
  /api/v1/control-panel/certificates/operations:
    post: {operationId: control.panel.certificates.operations.create, security: [{sanctum: []}], responses: {'201': {description: Certificate operation recorded}}}
  /api/v1/control-panel/certificates/lifecycle:
    post: {operationId: control.panel.certificates.lifecycle.record, security: [{sanctum: []}], responses: {'201': {description: Certificate lifecycle event recorded}}}
  /api/v1/control-panel/certificates/{certificate}:
    get: {operationId: control.panel.certificates.show, security: [{sanctum: []}], responses: {'200': {description: Authorized certificate}}}
  /api/v1/control-panel/certificates/{certificate}/revoke:
    post:
      operationId: control.panel.certificates.revoke
      security: [{sanctum: []}]
      responses: {'200': {description: Certificate revoked}}
  /api/v1/control-panel/certificates/{certificate}/deploy:
    post:
      operationId: control.panel.certificates.deploy
      security: [{sanctum: []}]
      responses: {'202': {description: Certificate deployment queued}}
  /api/v1/control-panel/certificates/{certificate}/renew:
    post:
      operationId: control.panel.certificates.renew
      security: [{sanctum: []}]
      responses: {'202': {description: Certificate renewal queued}}
  /api/v1/control-panel/certificates/{certificate}/expiry-check:
    post:
      operationId: control.panel.certificates.expiry.check
      security: [{sanctum: []}]
      responses: {'200': {description: Certificate expiry status recorded}}
  /api/v1/control-panel/certificates/{certificate}/expire:
    post:
      operationId: control.panel.certificates.expire
      security: [{sanctum: []}]
      responses: {'200': {description: Certificate expired}, '422': {description: Certificate expiration is invalid}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
