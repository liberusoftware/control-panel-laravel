openapi: 3.1.0
info:
  title: Control Panel Web Hosting API
  version: 1.0.0
paths:
  /webhooks/github/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.github
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid signature.}, '200': {description: Deployment not triggered.}}
  /webhooks/gitlab/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.gitlab
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Gitlab-Token, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid token.}, '200': {description: Deployment not triggered.}}
  /webhooks/generic/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.generic
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Webhook-Secret, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid secret.}, '200': {description: Deployment not triggered.}}
  /api/v1/control-panel/web-hosting/domains:
    get:
      summary: List domains
      security: [{sanctum: []}]
      responses: {'200': {description: OK}}
    post:
      summary: Register a domain
      security: [{sanctum: []}]
      responses: {'201': {description: Created}}
  /api/v1/control-panel/web-hosting/usage:
    get:
      operationId: control.panel.web.hosting.usage.list
      security: [{sanctum: []}]
      parameters:
        - {name: domain_id, in: query, schema: {type: string, format: uuid}}
        - {name: months, in: query, schema: {type: integer, minimum: 1, maximum: 60, default: 12}}
      responses: {'200': {description: Tenant-scoped monthly resource usage.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/usage:
    get:
      operationId: control.panel.web.hosting.domains.usage.list
      security: [{sanctum: []}]
      parameters:
        - {name: domain, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: months, in: query, schema: {type: integer, minimum: 1, maximum: 60, default: 12}}
      responses: {'200': {description: Monthly resource usage for the authorized domain.}, '404': {description: Domain is outside the current team.}}
    post:
      operationId: control.panel.web.hosting.domains.usage.record
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                month: {type: integer, minimum: 1, maximum: 12}
                year: {type: integer, minimum: 2000, maximum: 2200}
                disk_usage_mb: {type: integer, minimum: 0}
                bandwidth_usage_mb: {type: integer, minimum: 0}
      responses: {'201': {description: Monthly resource usage recorded.}, '404': {description: Domain is outside the current team.}, '422': {description: Invalid usage values.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/cron-jobs:
    get:
      operationId: control.panel.web.hosting.domains.cron-jobs.list
      security: [{sanctum: []}]
      responses: {'200': {description: Cron jobs for the authorized domain.}}
    post:
      operationId: control.panel.web.hosting.domains.cron-jobs.create
      security: [{sanctum: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name, command, schedule], properties: {name: {type: string}, command: {type: string}, schedule: {type: string, example: '0 * * * *'}, active: {type: boolean}}}
      responses: {'201': {description: Cron job created.}, '404': {description: Domain is outside the current team.}, '422': {description: Invalid cron job.}}
  /api/v1/control-panel/web-hosting/cron-jobs/{job}:
    patch:
      operationId: control.panel.web.hosting.cron-jobs.update
      security: [{sanctum: []}]
      responses: {'200': {description: Cron job updated.}}
    delete:
      operationId: control.panel.web.hosting.cron-jobs.delete
      security: [{sanctum: []}]
      responses: {'204': {description: Cron job deleted.}}
  /api/v1/control-panel/web-hosting/cron-jobs/{job}/executions:
    get:
      operationId: control.panel.web.hosting.cron-jobs.executions.list
      security: [{sanctum: []}]
      responses: {'200': {description: Cron execution history.}}
    post:
      operationId: control.panel.web.hosting.cron-jobs.executions.record
      security: [{sanctum: []}]
      responses: {'201': {description: Cron execution recorded.}}
    patch:
      operationId: control.panel.web.hosting.domains.update
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {hostname: {type: string, maxLength: 253}, account_id: {type: string, nullable: true, maxLength: 255}, metadata: {type: object, nullable: true}}}
      responses: {'200': {description: Domain updated.}, '404': {description: Domain is outside the current team.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/activate:
    post:
      operationId: control.panel.web.hosting.domains.activate
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Domain activated.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/suspend:
    post:
      operationId: control.panel.web.hosting.domains.suspend
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 1000}}}
      responses: {'200': {description: Domain suspended.}, '422': {description: Invalid lifecycle transition or reason.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/archive:
    post:
      operationId: control.panel.web.hosting.domains.archive
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Domain archived.}, '422': {description: Domain is already archived.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/virtual-hosts:
    post:
      summary: Create or update a virtual host desired state
      security: [{sanctum: []}]
      responses: {'201': {description: Virtual host registered.}}
  /api/v1/control-panel/web-hosting/virtual-hosts/{virtualHost}:
    patch:
      operationId: control.panel.web.hosting.virtual.hosts.update
      security: [{sanctum: []}]
      parameters: [{name: virtualHost, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Virtual host updated.}, '404': {description: Virtual host is outside the current team.}}
    delete:
      operationId: control.panel.web.hosting.virtual.hosts.delete
      security: [{sanctum: []}]
      responses: {'204': {description: Virtual host deleted.}, '404': {description: Virtual host is outside the current team.}}
  /api/v1/control-panel/web-hosting/deployments:
    get:
      operationId: control.panel.web.hosting.deployments.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized Git deployment collection.}}
  /api/v1/control-panel/web-hosting/deployments/{deployment}/deploy:
    post:
      operationId: control.panel.web.hosting.deployments.deploy
      security: [{sanctum: []}]
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Git deployment queued.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/deployments:
    post:
      operationId: control.panel.web.hosting.deployments.create
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Git deployment registered.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/php-configuration:
    put:
      operationId: control.panel.web.hosting.php.configuration.update
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: PHP configuration saved.}}
  /api/v1/control-panel/web-hosting/resources/{kind}:
    get:
      operationId: control.panel.web.hosting.resources.list
      security: [{sanctum: []}]
      parameters: [{name: kind, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Authorized hosting resource collection.}}
  /api/v1/control-panel/web-hosting/applications:
    get:
      operationId: control.panel.web.hosting.applications.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized hosted application collection.}}
    post:
      operationId: control.panel.web.hosting.applications.create
      security: [{sanctum: []}]
      responses: {'201': {description: Hosted application registered.}}
  /api/v1/control-panel/web-hosting/applications/{application}:
    patch:
      operationId: control.panel.web.hosting.applications.update
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Hosted application updated.}, '404': {description: Application is outside the current team.}}
    delete:
      operationId: control.panel.web.hosting.applications.delete
      security: [{sanctum: []}]
      responses: {'204': {description: Hosted application deleted.}, '404': {description: Application is outside the current team.}}
  /api/v1/control-panel/web-hosting/applications/statistics:
    get:
      operationId: control.panel.web.hosting.applications.statistics
      security: [{sanctum: []}]
      parameters: [{name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}]
      responses: {'200': {description: Tenant-scoped hosted application statistics.}}
  /api/v1/control-panel/web-hosting/applications/{application}/performance:
    get:
      operationId: control.panel.web.hosting.applications.performance
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}, {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 720}}]
      responses: {'200': {description: Application performance metrics and summary.}}
  /api/v1/control-panel/web-hosting/applications/{application}/health-checks:
    post:
      operationId: control.panel.web.hosting.applications.health
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Application health check recorded.}}
  /api/v1/control-panel/web-hosting/applications/{application}/wordpress-update-checks:
    post:
      operationId: control.panel.web.hosting.applications.wordpress.update.check
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: WordPress update status.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/redirects:
    post:
      operationId: control.panel.web.hosting.redirects.store
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Redirect policy created.}}
  /api/v1/control-panel/web-hosting/redirects/{redirect}:
    patch:
      operationId: control.panel.web.hosting.redirects.update
      security: [{sanctum: []}]
      parameters: [{name: redirect, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Redirect policy updated.}, '404': {description: Redirect is outside the current team.}}
    delete:
      operationId: control.panel.web.hosting.redirects.delete
      security: [{sanctum: []}]
      parameters: [{name: redirect, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Redirect policy deleted.}, '404': {description: Redirect is outside the current team.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/mime-types:
    post:
      operationId: control.panel.web.hosting.mime.types.store
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: MIME type metadata created.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/hotlink-protection:
    post:
      operationId: control.panel.web.hosting.hotlink.protection.store
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Hotlink protection configured.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/directory-protections:
    post:
      operationId: control.panel.web.hosting.directory.protections.store
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Directory protection configured.}}
  /api/v1/control-panel/web-hosting/directory-protections/{protection}/users:
    post:
      operationId: control.panel.web.hosting.directory.protection.users.store
      security: [{sanctum: []}]
      parameters: [{name: protection, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Directory protection user created.}}
  /api/v1/control-panel/web-hosting/directory-protections/{protection}:
    delete:
      operationId: control.panel.web.hosting.directory.protections.delete
      security: [{sanctum: []}]
      parameters: [{name: protection, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Directory protection deleted.}}
  /api/v1/control-panel/web-hosting/directory-protection-users/{user}:
    delete:
      operationId: control.panel.web.hosting.directory.protection.users.delete
      security: [{sanctum: []}]
      parameters: [{name: user, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Directory protection user deleted.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/custom-error-pages:
    post:
      operationId: control.panel.web.hosting.custom.error.pages.store
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Custom error page saved.}}
  /api/v1/control-panel/web-hosting/custom-error-pages/{page}:
    delete:
      operationId: control.panel.web.hosting.custom.error.pages.delete
      security: [{sanctum: []}]
      parameters: [{name: page, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Custom error page deleted.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/subdomains:
    get:
      operationId: control.panel.web.hosting.domains.subdomains.list
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Subdomains for the authorized domain.}, '404': {description: Domain is outside the current team.}}
    post:
      operationId: control.panel.web.hosting.domains.subdomains.create
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Subdomain created.}, '422': {description: Invalid subdomain configuration.}}
  /api/v1/control-panel/web-hosting/subdomains/{subdomain}:
    patch:
      operationId: control.panel.web.hosting.subdomains.update
      security: [{sanctum: []}]
      parameters: [{name: subdomain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Subdomain updated.}, '404': {description: Subdomain is outside the current team.}}
    delete:
      operationId: control.panel.web.hosting.subdomains.delete
      security: [{sanctum: []}]
      parameters: [{name: subdomain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Subdomain deleted.}, '404': {description: Subdomain is outside the current team.}}
