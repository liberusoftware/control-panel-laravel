openapi: 3.1.0
info:
  title: Control Panel Web Hosting API
  version: 1.0.0
paths:
  /webhooks/github/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.github
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid signature.}, '200': {description: Deployment not triggered.}}
  /webhooks/gitlab/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.gitlab
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Gitlab-Token, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid token.}, '200': {description: Deployment not triggered.}}
  /webhooks/generic/{deployment}:
    post:
      operationId: control.panel.web.hosting.webhooks.generic
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}, {name: X-Webhook-Secret, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Deployment queued.}, '401': {description: Invalid secret.}, '200': {description: Deployment not triggered.}}
  /api/v1/control-panel/web-hosting/domains:
    get:
      summary: List domains
      security: [{sanctum: []}]
      responses: {'200': {description: OK}}
    post:
      summary: Register a domain
      security: [{sanctum: []}]
      responses: {'201': {description: Created}}
  /api/v1/control-panel/web-hosting/domains/{domain}/activate:
    post:
      operationId: control.panel.web.hosting.domains.activate
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Domain activated.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/suspend:
    post:
      operationId: control.panel.web.hosting.domains.suspend
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 1000}}}
      responses: {'200': {description: Domain suspended.}, '422': {description: Invalid lifecycle transition or reason.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/archive:
    post:
      operationId: control.panel.web.hosting.domains.archive
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Domain archived.}, '422': {description: Domain is already archived.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/virtual-hosts:
    post:
      summary: Create or update a virtual host desired state
      security: [{sanctum: []}]
      responses: {'201': {description: Virtual host registered.}}
  /api/v1/control-panel/web-hosting/deployments:
    get:
      operationId: control.panel.web.hosting.deployments.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized Git deployment collection.}}
  /api/v1/control-panel/web-hosting/deployments/{deployment}/deploy:
    post:
      operationId: control.panel.web.hosting.deployments.deploy
      security: [{sanctum: []}]
      parameters: [{name: deployment, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Git deployment queued.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/deployments:
    post:
      operationId: control.panel.web.hosting.deployments.create
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Git deployment registered.}}
  /api/v1/control-panel/web-hosting/domains/{domain}/php-configuration:
    put:
      operationId: control.panel.web.hosting.php.configuration.update
      security: [{sanctum: []}]
      parameters: [{name: domain, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: PHP configuration saved.}}
  /api/v1/control-panel/web-hosting/resources/{kind}:
    get:
      operationId: control.panel.web.hosting.resources.list
      security: [{sanctum: []}]
      parameters: [{name: kind, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Authorized hosting resource collection.}}
  /api/v1/control-panel/web-hosting/applications:
    get:
      operationId: control.panel.web.hosting.applications.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized hosted application collection.}}
    post:
      operationId: control.panel.web.hosting.applications.create
      security: [{sanctum: []}]
      responses: {'201': {description: Hosted application registered.}}
  /api/v1/control-panel/web-hosting/applications/{application}/performance:
    get:
      operationId: control.panel.web.hosting.applications.performance
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}, {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 720}}]
      responses: {'200': {description: Application performance metrics and summary.}}
  /api/v1/control-panel/web-hosting/applications/{application}/health-checks:
    post:
      operationId: control.panel.web.hosting.applications.health
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Application health check recorded.}}
  /api/v1/control-panel/web-hosting/applications/{application}/wordpress-update-checks:
    post:
      operationId: control.panel.web.hosting.applications.wordpress.update.check
      security: [{sanctum: []}]
      parameters: [{name: application, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: WordPress update status.}}
