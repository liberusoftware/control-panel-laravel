openapi: 3.1.0
info: {title: Control Panel API and Automation API, version: 1.0.0}
paths:
  /api/v1/control-panel/api-and-automation:
    get: {operationId: control.panel.api.and.automation.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: control.panel.api.and.automation.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, kind]}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/templates:
      post: {operationId: control.panel.api.and.automation.templates.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateCreate'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/credentials:
    post: {operationId: control.panel.api.and.automation.credentials.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialCreate'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/webhooks:
    post: {operationId: control.panel.api.and.automation.webhooks.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookCreate'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/webhooks/{webhook}:
    patch: {operationId: control.panel.api.and.automation.webhooks.update, security: [{sanctum: []}], parameters: [{name: webhook, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}, '404': {description: Webhook is outside the current team.}}
  /api/v1/control-panel/api-and-automation/webhooks/{webhook}/pause:
    post: {operationId: control.panel.api.and.automation.webhooks.pause, security: [{sanctum: []}], responses: {'200': {description: Webhook paused.}, '422': {description: Webhook cannot be paused.}}}
  /api/v1/control-panel/api-and-automation/webhooks/{webhook}/resume:
    post: {operationId: control.panel.api.and.automation.webhooks.resume, security: [{sanctum: []}], responses: {'200': {description: Webhook resumed.}, '422': {description: Webhook cannot be resumed.}}}
  /api/v1/control-panel/api-and-automation/templates/{template}/runs:
    post:
      operationId: control.panel.api.and.automation.runs.create
      security: [{sanctum: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 255}}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {input: {type: object, additionalProperties: true}}}}}}
      responses: {'202': {$ref: '#/components/responses/Resource'}}
  /api/v1/control-panel/api-and-automation/schedules:
    post: {operationId: control.panel.api.and.automation.schedules.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleCreate'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/commands:
    post: {operationId: control.panel.api.and.automation.commands.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommandCreate'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/billing-events:
    post: {operationId: control.panel.api.and.automation.billing.events.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillingEventCreate'}}}}, responses: {'202': {$ref: '#/components/responses/Resource'}}}
  /api/v1/control-panel/api-and-automation/{automation}:
    get: {operationId: control.panel.api.automation.show, security: [{sanctum: []}], responses: {'200': {description: Authorized automation definition}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  responses:
    Resource: {description: Created resource without credentials, content: {application/json: {schema: {type: object}}}}
    Collection: {description: Authorized team-scoped resources without credentials, content: {application/json: {schema: {type: object}}}}
  schemas:
    CredentialCreate: {type: object, required: [name], properties: {name: {type: string, maxLength: 120}, scopes: {type: array, items: {type: string, maxLength: 120}}, secret: {type: string, writeOnly: true}, expires_at: {type: string, format: date-time}}}
    WebhookCreate: {type: object, required: [name, url], properties: {name: {type: string, maxLength: 120}, url: {type: string, format: uri, pattern: '^https://'}, events: {type: array, items: {type: string, maxLength: 120}}, secret: {type: string, writeOnly: true}, retry_limit: {type: integer, minimum: 0, maximum: 20}}}
    WebhookUpdate: {type: object, properties: {name: {type: string, maxLength: 120}, url: {type: string, format: uri, pattern: '^https://'}, events: {type: array, items: {type: string, maxLength: 120}}, retry_limit: {type: integer, minimum: 0, maximum: 20}}}
    TemplateCreate: {type: object, required: [name, version, steps], properties: {name: {type: string, maxLength: 120}, version: {type: string, maxLength: 40}, description: {type: string}, inputs: {type: array}, steps: {type: array, minItems: 1}, active: {type: boolean}}}
    ScheduleCreate: {type: object, required: [name, cron, template_id], properties: {name: {type: string, maxLength: 120}, cron: {type: string}, timezone: {type: string}, template_id: {type: string, format: uuid}, next_run_at: {type: string, format: date-time}}}
    CommandCreate: {type: object, required: [name, command], properties: {name: {type: string, maxLength: 120}, description: {type: string}, command: {type: string, maxLength: 255}, arguments: {type: array}, enabled: {type: boolean}}}
    BillingEventCreate: {type: object, required: [external_id, event_type, payload], properties: {external_id: {type: string, maxLength: 255}, event_type: {type: string, maxLength: 120}, payload: {type: object, additionalProperties: true}}}
