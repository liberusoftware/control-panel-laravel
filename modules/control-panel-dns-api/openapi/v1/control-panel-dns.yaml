openapi: 3.1.0
info:
  title: Control Panel DNS API
  version: 1.0.0
paths:
  /api/v1/control-panel/dns/records/bulk:
    post:
      operationId: control.panel.dns.records.bulk
      security: [{sanctum: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [zone_id, records], properties: {zone_id: {type: string, format: uuid}, records: {type: array, minItems: 1, maxItems: 50, items: {type: object, required: [name, type, content]}}}}}}}
      responses: {'201': {description: All records created.}, '207': {description: Some records created.}, '422': {description: No records created or invalid input.}}
  /api/v1/control-panel/dns/zones:
    get:
      operationId: control.panel.dns.zones.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized paginated zones}}
    post:
      operationId: control.panel.dns.zones.create
      security: [{sanctum: []}]
      responses: {'201': {description: Zone created}}
  /api/v1/control-panel/dns/records:
    post: {operationId: control.panel.dns.records.create, security: [{sanctum: []}], responses: {'201': {description: DNS record created}}}
  /api/v1/control-panel/dns/checks:
    post: {operationId: control.panel.dns.checks.create, security: [{sanctum: []}], responses: {'201': {description: DNS validation check recorded}}}
  /api/v1/control-panel/dns/features:
    post: {operationId: control.panel.dns.features.record, security: [{sanctum: []}], responses: {'201': {description: DNS feature recorded}}}
  /api/v1/control-panel/dns/zones/{zone}:
    get: {operationId: control.panel.dns.zones.show, security: [{sanctum: []}], responses: {'200': {description: Authorized DNS zone}}}
    patch: {operationId: control.panel.dns.zones.update, security: [{sanctum: []}], responses: {'200': {description: DNS zone updated.}, '422': {description: Invalid DNS zone data.}}}
  /api/v1/control-panel/dns/zones/{zone}/suspend:
    post: {operationId: control.panel.dns.zones.suspend, security: [{sanctum: []}], responses: {'200': {description: DNS zone suspended.}, '422': {description: DNS zone cannot be suspended.}}}
  /api/v1/control-panel/dns/zones/{zone}/archive:
    post: {operationId: control.panel.dns.zones.archive, security: [{sanctum: []}], responses: {'200': {description: DNS zone archived.}, '422': {description: DNS zone is already archived.}}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
