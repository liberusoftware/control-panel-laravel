apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boilerplate-laravel
  labels:
    app: boilerplate-laravel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - boilerplate.example.com  # REPLACE WITH YOUR DOMAIN
    secretName: boilerplate-tls
  rules:
  - host: boilerplate.example.com  # REPLACE WITH YOUR DOMAIN
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: boilerplate-laravel
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boilerplate-reverb
  labels:
    app: boilerplate-laravel
    component: reverb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ws.boilerplate.example.com  # REPLACE WITH YOUR WS DOMAIN
    secretName: boilerplate-reverb-tls
  rules:
  - host: ws.boilerplate.example.com  # REPLACE WITH YOUR WS DOMAIN
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: boilerplate-reverb
            port:
              number: 6001
