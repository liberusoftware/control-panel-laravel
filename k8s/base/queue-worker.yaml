apiVersion: batch/v1
kind: CronJob
metadata:
  name: boilerplate-scheduler
  labels:
    app: boilerplate-laravel
    component: scheduler
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: boilerplate-laravel
            component: scheduler
        spec:
          restartPolicy: OnFailure
          containers:
          - name: scheduler
            image: ghcr.io/liberusoftware/control-panel-laravel:latest
            command:
            - php
            - artisan
            - schedule:run
            envFrom:
            - configMapRef:
                name: boilerplate-config
            - secretRef:
                name: boilerplate-secrets
            volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          volumes:
          - name: storage
            persistentVolumeClaim:
              claimName: boilerplate-storage
          securityContext:
            fsGroup: 1000
